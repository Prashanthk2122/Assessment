baseUrl=https://seahorse-app-tam6f.ondigitalocean.app/bank-api

# Observed/documented non-transfer behaviour is isolated here.
# If the live Swagger explicitly documents a different value, update only
# the matching property. Do not weaken assertions with multiple alternatives.
status.customer.create=200
status.customer.get=200
status.customer.update=200
status.customer.delete=200

# In the currently deployed service, a missing customer has been observed as
# HTTP 200 with an empty response body.
status.customer.absent=200

status.account.create=200
status.account.get=200

# If Swagger documents a different missing-account response, change only this.
status.account.absent=200

# Exercise acceptance rules - keep these strict.
status.transfer.success=200
status.transfer.reject=400

# Observed deployed behaviour for unknown customer account creation.
status.unknownCustomer=400

# Malformed JSON must be rejected.
status.malformedJson=400

status.account.notFound=404


# Customer request mapping.
contract.customer.numberField=customerNumber
contract.customer.firstNameField=firstName
contract.customer.lastNameField=lastName
contract.customer.addressField=address
contract.customer.cityField=city
contract.customer.stateField=state
contract.customer.mobileField=mobileNum
contract.customer.statusField=status

# Account request mapping.
contract.account.numberField=accountNumber
contract.account.typeField=accout_type
contract.account.nameField=account_name
contract.account.descriptionField=description
contract.account.balanceField=balance
contract.account.interestRateField=interestRate

# Transfer request mapping.
# Confirm these three names against the assignment Swagger before final submission.
contract.transfer.fromField=fromAccountNumber
contract.transfer.toField=toAccountNumber
contract.transfer.amountField=transferAmount


